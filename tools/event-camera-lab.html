<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Camera Lab</title>
</head>
<body>
<div id="event-camera-lab">
  <style>
    #event-camera-lab {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #171a1f;
      --muted: #68707c;
      --line: #d9dee7;
      --accent: #2563eb;
      --danger: #b91c1c;
      --on: #ff2b2b;
      --off: #1e5bff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }
    #event-camera-lab * {
      box-sizing: border-box;
    }
    #event-camera-lab h1 {
      margin: 0 0 18px;
      font-size: 24px;
      letter-spacing: 0;
    }
    #event-camera-lab .layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    #event-camera-lab .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    #event-camera-lab .controls {
      display: grid;
      gap: 12px;
    }
    #event-camera-lab label {
      display: grid;
      gap: 5px;
      font-size: 13px;
      color: var(--muted);
    }
    #event-camera-lab input,
    #event-camera-lab select,
    #event-camera-lab button {
      font: inherit;
    }
    #event-camera-lab input[type="number"],
    #event-camera-lab input[type="range"],
    #event-camera-lab input[type="file"],
    #event-camera-lab select {
      width: 100%;
    }
    #event-camera-lab input[type="number"],
    #event-camera-lab select {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 9px;
      color: var(--ink);
      background: #fff;
    }
    #event-camera-lab .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    #event-camera-lab .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    #event-camera-lab .transport {
      display: grid;
      grid-template-columns: auto auto auto 1fr;
      gap: 8px;
      align-items: end;
    }
    #event-camera-lab .frame-readout {
      font-size: 13px;
      color: var(--muted);
      padding-bottom: 9px;
      text-align: right;
      white-space: nowrap;
    }
    #event-camera-lab button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }
    #event-camera-lab button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    #event-camera-lab button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    #event-camera-lab .status {
      min-height: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    #event-camera-lab .status.error {
      color: var(--danger);
    }
    #event-camera-lab .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(100px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    #event-camera-lab .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }
    #event-camera-lab .stat b {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }
    #event-camera-lab .stat span {
      font-size: 12px;
      color: var(--muted);
    }
    #event-camera-lab .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    #event-camera-lab .canvas-wrap {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      min-width: 0;
    }
    #event-camera-lab .canvas-title {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    #event-camera-lab canvas,
    #event-camera-lab video {
      width: 100%;
      max-height: 360px;
      background: #000;
      display: block;
      border-radius: 4px;
      image-rendering: pixelated;
    }
    #event-camera-lab video {
      display: none;
    }
    #event-camera-lab .downloads {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    #event-camera-lab a.download {
      border: 1px solid var(--line);
      color: var(--ink);
      text-decoration: none;
      border-radius: 6px;
      padding: 8px 12px;
      background: #fff;
      font-size: 13px;
    }
    @media (max-width: 900px) {
      #event-camera-lab .layout,
      #event-camera-lab .preview-grid {
        grid-template-columns: 1fr;
      }
      #event-camera-lab .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>

  <h1>Event Camera Lab</h1>
  <div class="layout">
    <section class="panel controls">
      <label>
        MP4 video
        <input id="video-file" type="file" accept="video/mp4,video/*">
      </label>
      <div class="row">
        <label>
          ON threshold
          <input id="threshold-on" type="number" min="0.01" step="0.01" value="0.30">
        </label>
        <label>
          OFF threshold
          <input id="threshold-off" type="number" min="0.01" step="0.01" value="0.30">
        </label>
      </div>
      <div class="row">
        <label>
          Log epsilon
          <input id="epsilon" type="number" min="0.000001" step="0.001" value="0.001">
        </label>
        <label>
          Sampling FPS
          <input id="sample-fps" type="number" min="1" step="1" value="30">
        </label>
      </div>
      <div class="row">
        <label>
          Max frames
          <input id="max-frames" type="number" min="2" step="1" value="120">
        </label>
        <label>
          Accumulation ms
          <input id="window-ms" type="number" min="1" step="1" value="20">
        </label>
      </div>
      <label>
        Preview frame
        <input id="preview-index" type="range" min="0" max="0" value="0">
      </label>
      <div class="transport">
        <button id="previous-frame" type="button">Previous</button>
        <button id="play" type="button">Play</button>
        <button id="next-frame" type="button">Next</button>
        <label>
          Speed
          <select id="play-speed">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
          </select>
        </label>
        <div id="frame-readout" class="frame-readout">0 / 0</div>
      </div>
      <div class="actions">
        <button id="run" class="primary" type="button">Run simulation</button>
        <button id="clear" type="button">Clear</button>
      </div>
      <div id="status" class="status">Upload an MP4, then run the simulation.</div>
    </section>

    <main>
      <div class="stats">
        <div class="stat"><b id="total-events">0</b><span>Total events</span></div>
        <div class="stat"><b id="on-events">0</b><span>ON events</span></div>
        <div class="stat"><b id="off-events">0</b><span>OFF events</span></div>
        <div class="stat"><b id="event-rate">0/s</b><span>Event rate</span></div>
      </div>
      <section class="preview-grid">
        <div class="canvas-wrap">
          <div class="canvas-title">Input frame</div>
          <canvas id="input-canvas"></canvas>
        </div>
        <div class="canvas-wrap">
          <div class="canvas-title">Event frame</div>
          <canvas id="event-canvas"></canvas>
        </div>
        <div class="canvas-wrap">
          <div class="canvas-title">Overlay</div>
          <canvas id="overlay-canvas"></canvas>
        </div>
      </section>
      <video id="video" muted playsinline></video>
      <div id="downloads" class="downloads"></div>
    </main>
  </div>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const state = {
        frames: [],
        logs: [],
        times: [],
        events: [],
        width: 0,
        height: 0,
        duration: 0,
        playTimer: 0
      };

      function status(text, isError = false) {
        $("status").textContent = text;
        $("status").classList.toggle("error", isError);
      }

      function numberValue(id) {
        return Number($(id).value);
      }

      function setupCanvas(canvas, width, height) {
        canvas.width = width;
        canvas.height = height;
      }

      function drawImageData(canvas, pixels, width, height) {
        setupCanvas(canvas, width, height);
        const context = canvas.getContext("2d");
        const imageData = context.createImageData(width, height);
        imageData.data.set(pixels);
        context.putImageData(imageData, 0, 0);
      }

      function stopPlayback() {
        if (state.playTimer) {
          window.clearInterval(state.playTimer);
          state.playTimer = 0;
        }
        $("play").textContent = "Play";
      }

      function setFrame(index) {
        if (!state.frames.length) return;
        const maximum = state.frames.length - 1;
        const clamped = Math.max(0, Math.min(maximum, index));
        $("preview-index").value = String(clamped);
        renderCurrentFrame();
        makeDownloads();
      }

      function updateFrameReadout(frameIndex) {
        if (!state.frames.length) {
          $("frame-readout").textContent = "0 / 0";
          return;
        }
        $("frame-readout").textContent = `${frameIndex + 1} / ${state.frames.length}`;
      }

      function grayscaleLogFromRgba(rgba, epsilon) {
        const pixels = rgba.data;
        const logFrame = new Float64Array(rgba.width * rgba.height);
        for (let index = 0; index < logFrame.length; index += 1) {
          const base = index * 4;
          const gray = (0.299 * pixels[base] + 0.587 * pixels[base + 1] + 0.114 * pixels[base + 2]) / 255;
          logFrame[index] = Math.log(gray + epsilon);
        }
        return logFrame;
      }

      function seek(video, time) {
        return new Promise((resolve, reject) => {
          const done = () => {
            video.removeEventListener("seeked", done);
            resolve();
          };
          video.addEventListener("seeked", done, { once: true });
          video.currentTime = Math.min(time, Math.max(video.duration - 0.001, 0));
          setTimeout(() => reject(new Error("video seek timed out")), 10000);
        });
      }

      async function decodeFrames(file) {
        const video = $("video");
        const url = URL.createObjectURL(file);
        video.src = url;
        await new Promise((resolve, reject) => {
          video.onloadedmetadata = resolve;
          video.onerror = () => reject(new Error("could not load video metadata"));
        });
        const fps = numberValue("sample-fps");
        const maxFrames = numberValue("max-frames");
        if (!Number.isFinite(fps) || fps <= 0 || !Number.isFinite(maxFrames) || maxFrames < 2) {
          throw new Error("sampling FPS and max frames must be valid");
        }
        const width = video.videoWidth;
        const height = video.videoHeight;
        const duration = video.duration;
        const count = Math.max(2, Math.min(Math.floor(duration * fps) + 1, Math.floor(maxFrames)));
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d", { willReadFrequently: true });
        const frames = [];
        const logs = [];
        const times = [];
        const epsilon = numberValue("epsilon");
        for (let index = 0; index < count; index += 1) {
          const time = count === 1 ? 0 : (index / (count - 1)) * Math.max(duration - 0.001, 0);
          status(`Decoding frame ${index + 1}/${count}...`);
          await seek(video, time);
          context.drawImage(video, 0, 0, width, height);
          const rgba = context.getImageData(0, 0, width, height);
          frames.push(new Uint8ClampedArray(rgba.data));
          logs.push(grayscaleLogFromRgba(rgba, epsilon));
          times.push(time);
        }
        URL.revokeObjectURL(url);
        return { frames, logs, times, width, height, duration };
      }

      function simulateEvents(logs, times, width, height) {
        const thresholdOn = numberValue("threshold-on");
        const thresholdOff = numberValue("threshold-off");
        if (thresholdOn <= 0 || thresholdOff <= 0) {
          throw new Error("thresholds must be positive");
        }
        const reference = new Float64Array(logs[0]);
        const events = [];
        for (let frameIndex = 1; frameIndex < logs.length; frameIndex += 1) {
          const start = logs[frameIndex - 1];
          const end = logs[frameIndex];
          const t0 = times[frameIndex - 1];
          const t1 = times[frameIndex];
          const dt = t1 - t0;
          for (let y = 0; y < height; y += 1) {
            for (let x = 0; x < width; x += 1) {
              const index = y * width + x;
              if (end[index] > start[index]) {
                while (end[index] - reference[index] >= thresholdOn - 1e-12) {
                  const target = reference[index] + thresholdOn;
                  const fraction = (target - start[index]) / (end[index] - start[index]);
                  events.push({ t: Math.round((t0 + Math.max(0, Math.min(1, fraction)) * dt) * 1000000), x, y, p: 1 });
                  reference[index] = target;
                }
              } else if (end[index] < start[index]) {
                while (reference[index] - end[index] >= thresholdOff - 1e-12) {
                  const target = reference[index] - thresholdOff;
                  const fraction = (target - start[index]) / (end[index] - start[index]);
                  events.push({ t: Math.round((t0 + Math.max(0, Math.min(1, fraction)) * dt) * 1000000), x, y, p: -1 });
                  reference[index] = target;
                }
              }
            }
          }
        }
        events.sort((a, b) => a.t - b.t || a.y - b.y || a.x - b.x || a.p - b.p);
        return events;
      }

      function accumulate(events, startUs, endUs, width, height) {
        const positive = new Uint16Array(width * height);
        const negative = new Uint16Array(width * height);
        for (const event of events) {
          if (event.t >= startUs && event.t < endUs) {
            const index = event.y * width + event.x;
            if (event.p > 0) positive[index] += 1;
            else negative[index] += 1;
          }
        }
        return { positive, negative };
      }

      function renderCurrentFrame() {
        if (!state.frames.length) return;
        const frameIndex = Number($("preview-index").value);
        const width = state.width;
        const height = state.height;
        drawImageData($("input-canvas"), state.frames[frameIndex], width, height);
        const centerUs = Math.round(state.times[frameIndex] * 1000000);
        const windowUs = Math.round(numberValue("window-ms") * 1000);
        const counts = accumulate(state.events, centerUs, centerUs + windowUs, width, height);
        const eventPixels = new Uint8ClampedArray(width * height * 4);
        const overlayPixels = new Uint8ClampedArray(state.frames[frameIndex]);
        for (let index = 0; index < width * height; index += 1) {
          const base = index * 4;
          const on = counts.positive[index] > 0;
          const off = counts.negative[index] > 0;
          let r = 0;
          let g = 0;
          let b = 0;
          if (on && off) {
            r = 255; g = 255; b = 255;
          } else if (on) {
            r = 255;
          } else if (off) {
            b = 255;
          }
          eventPixels[base] = r;
          eventPixels[base + 1] = g;
          eventPixels[base + 2] = b;
          eventPixels[base + 3] = 255;
          if (on || off) {
            overlayPixels[base] = Math.round(0.35 * overlayPixels[base] + 0.65 * r);
            overlayPixels[base + 1] = Math.round(0.35 * overlayPixels[base + 1] + 0.65 * g);
            overlayPixels[base + 2] = Math.round(0.35 * overlayPixels[base + 2] + 0.65 * b);
          }
        }
        drawImageData($("event-canvas"), eventPixels, width, height);
        drawImageData($("overlay-canvas"), overlayPixels, width, height);
        updateFrameReadout(frameIndex);
      }

      function updateStats() {
        const total = state.events.length;
        const on = state.events.filter((event) => event.p > 0).length;
        const off = total - on;
        $("total-events").textContent = total.toLocaleString();
        $("on-events").textContent = on.toLocaleString();
        $("off-events").textContent = off.toLocaleString();
        $("event-rate").textContent = state.duration > 0 ? `${Math.round(total / state.duration).toLocaleString()}/s` : "0/s";
      }

      function makeDownloads() {
        const holder = $("downloads");
        holder.innerHTML = "";
        if (!state.events.length) return;
        const csv = ["t_us,x,y,p", ...state.events.map((event) => `${event.t},${event.x},${event.y},${event.p}`)].join("\n");
        const json = JSON.stringify({ width: state.width, height: state.height, duration: state.duration, events: state.events }, null, 2);
        const items = [
          ["events.csv", "text/csv", csv],
          ["events.json", "application/json", json]
        ];
        for (const [name, type, content] of items) {
          const link = document.createElement("a");
          link.className = "download";
          link.download = name;
          link.href = URL.createObjectURL(new Blob([content], { type }));
          link.textContent = `Download ${name}`;
          holder.appendChild(link);
        }
        const pngLink = document.createElement("a");
        pngLink.className = "download";
        pngLink.download = "overlay.png";
        pngLink.href = $("overlay-canvas").toDataURL("image/png");
        pngLink.textContent = "Download overlay.png";
        holder.appendChild(pngLink);
      }

      $("run").addEventListener("click", async () => {
        try {
          const file = $("video-file").files[0];
          if (!file) throw new Error("choose a video first");
          $("run").disabled = true;
          status("Loading video...");
          const decoded = await decodeFrames(file);
          Object.assign(state, decoded);
          status("Simulating events...");
          state.events = simulateEvents(state.logs, state.times, state.width, state.height);
          $("preview-index").max = String(state.frames.length - 1);
          $("preview-index").value = "0";
          updateStats();
          renderCurrentFrame();
          makeDownloads();
          status(`Done. Processed ${state.frames.length} sampled frames.`);
        } catch (error) {
          status(error instanceof Error ? error.message : String(error), true);
        } finally {
          $("run").disabled = false;
        }
      });

      $("preview-index").addEventListener("input", () => {
        stopPlayback();
        renderCurrentFrame();
        makeDownloads();
      });
      $("window-ms").addEventListener("change", () => {
        renderCurrentFrame();
        makeDownloads();
      });
      $("previous-frame").addEventListener("click", () => {
        stopPlayback();
        setFrame(Number($("preview-index").value) - 1);
      });
      $("next-frame").addEventListener("click", () => {
        stopPlayback();
        setFrame(Number($("preview-index").value) + 1);
      });
      $("play").addEventListener("click", () => {
        if (!state.frames.length) {
          status("Run the simulation before playback.", true);
          return;
        }
        if (state.playTimer) {
          stopPlayback();
          return;
        }
        const sampleFps = Math.max(1, numberValue("sample-fps"));
        const speed = Math.max(0.25, numberValue("play-speed"));
        const intervalMs = Math.max(16, 1000 / (sampleFps * speed));
        $("play").textContent = "Pause";
        state.playTimer = window.setInterval(() => {
          const current = Number($("preview-index").value);
          const maximum = state.frames.length - 1;
          if (current >= maximum) {
            setFrame(0);
          } else {
            setFrame(current + 1);
          }
        }, intervalMs);
      });
      $("play-speed").addEventListener("change", () => {
        if (state.playTimer) {
          stopPlayback();
          $("play").click();
        }
      });
      $("clear").addEventListener("click", () => {
        stopPlayback();
        state.frames = [];
        state.logs = [];
        state.times = [];
        state.events = [];
        for (const id of ["input-canvas", "event-canvas", "overlay-canvas"]) {
          const canvas = $(id);
          canvas.width = 1;
          canvas.height = 1;
          canvas.getContext("2d").clearRect(0, 0, 1, 1);
        }
        $("downloads").innerHTML = "";
        $("preview-index").max = "0";
        $("preview-index").value = "0";
        updateFrameReadout(0);
        updateStats();
        status("Cleared. Upload an MP4, then run the simulation.");
      });
    })();
  </script>
</div>

</body>
</html>
